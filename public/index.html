<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Registration Portal | ICT461</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>ICT461 Academic Portal</h1>
    <nav aria-label="Main Navigation">
      <ul>
        <li><a href="#registration-section">Register</a></li>
        <li><a href="#records-section">Records</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="registration-section">
      <h2>Course Registration Form</h2>
      
      <!-- Visible feedback area for screen readers and users -->
      <div id="feedback" role="alert" aria-live="polite" class="feedback hidden"></div>

      <form id="registration-form" novalidate>
        <div class="form-group">
          <label for="student-name">Full Name</label>
          <input type="text" id="student-name" name="name" required placeholder="e.g., Jane Doe">
        </div>

        <div class="form-group">
          <label for="student-id">Student ID</label>
          <input type="text" id="student-id" name="studentId" required placeholder="e.g., 20261042">
        </div>

        <div class="form-group">
          <label for="programme">Programme</label>
          <select id="programme" name="programme" required>
            <option value="">-- Select Programme --</option>
            <option value="BSc Computer Science">BSc Computer Science</option>
            <option value="BSc Information Technology">BSc Information Technology</option>
            <option value="BSc Software Engineering">BSc Software Engineering</option>
          </select>
        </div>

        <div class="form-group">
          <label for="course">Course Code</label>
          <select id="course" name="course" required>
            <option value="">-- Loading Courses... --</option>
          </select>
        </div>

        <button type="submit" id="submit-btn" class="btn">Submit Registration</button>
      </form>
    </section>

    <section id="records-section">
      <h2>Active Registrations</h2>
      <button id="test-cookie-btn" class="btn btn-secondary">Test Cookie Route</button>
      <div id="records-container" class="records-grid"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 ICT461 Systems Engineering. All rights reserved.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
